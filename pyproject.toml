[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-experiment-runtime"
version = "0.1.0"
description = "A provider-neutral runtime for controlled AI experiments with Q-Batch evidence verification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aier = "ai_experiment_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
