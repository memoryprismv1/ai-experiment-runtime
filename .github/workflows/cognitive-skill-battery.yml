name: Real cognitive-skill A/B battery

on:
  push:
    paths:
      - ".github/cognitive-skill-run"
  workflow_dispatch:
    inputs:
      skill:
        description: "Run exactly one cognitive skill in an isolated experiment"
        required: true
        type: choice
        default: automaticity
        options:
          - automaticity
          - a-touch-of-grace
          - critical-thinking
          - context-course-correction
          - good-faith-collaboration
          - peer-review
          - optionality
          - software-literacy
          - task-integrity
          - verification-integrity

concurrency:
  group: cognitive-skill-battery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out runtime
        uses: actions/checkout@v4
      - name: Check out pinned Q-Batch verifier
        uses: actions/checkout@v4
        with:
          repository: memoryprismv1/q-batch-of-evidence
          ref: c059f5d5f969edcc7a87e7e288956a39c945cdc8
          path: .vendor/q-batch-of-evidence
      - name: Check out pinned cognitive skills (read-only test subjects)
        uses: actions/checkout@v4
        with:
          repository: memoryprismv1/cognitive-interface-ai-skills
          ref: fc530b6815eead24aa8655cbbb4bfe0dd8c9f666
          path: .vendor/cognitive-interface-ai-skills
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare runtime environment
        run: python setup_environment.py
      - name: Install local Ollama inference server
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_HOST=127.0.0.1:11434 ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || { cat /tmp/ollama.log; exit 1; }
          ollama pull qwen2.5:3b
      - name: Resolve selected skill and run inference preflight
        env:
          RUN_OUTPUT: artifacts/cognitive-skill-battery/${{ github.run_id }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            SKILL_ID="$(tr -d "[:space:]" < .github/cognitive-skill-run)"
          else
            SKILL_ID="${{ inputs.skill }}"
          fi
          case "${SKILL_ID}" in
            automaticity|a-touch-of-grace|critical-thinking|context-course-correction|good-faith-collaboration|peer-review|optionality|software-literacy|task-integrity|verification-integrity) ;;
            *) echo "::error::Select exactly one supported skill."; exit 1 ;;
          esac
          echo "SKILL_ID=${SKILL_ID}" >> "$GITHUB_ENV"
          .venv/bin/python scripts/run_cognitive_skill_preflight.py --skill "${SKILL_ID}" --output "${RUN_OUTPUT}/preflight" --model qwen2.5:3b --base-url http://127.0.0.1:11434/v1
      - name: Run local-model cognitive-skill experiments
        env:
          RUN_OUTPUT: artifacts/cognitive-skill-battery/${{ github.run_id }}
        shell: bash
        run: |
          .venv/bin/python scripts/run_cognitive_skill_battery.py --skills "${SKILL_ID}" --output "${RUN_OUTPUT}" --model qwen2.5:3b --base-url http://127.0.0.1:11434/v1
      - name: Upload blinded scorer packets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-skill-scorer-packets-${{ github.run_id }}
          path: artifacts/cognitive-skill-battery/${{ github.run_id }}/*/scorer/
          if-no-files-found: error
          retention-days: 30
      - name: Upload private controller material and Q-Batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-skill-controller-and-evidence-${{ github.run_id }}
          path: |
            artifacts/cognitive-skill-battery/${{ github.run_id }}/index.json
            artifacts/cognitive-skill-battery/${{ github.run_id }}/preflight/
            artifacts/cognitive-skill-battery/${{ github.run_id }}/*/controller/
            artifacts/cognitive-skill-battery/${{ github.run_id }}/*/experiment/
          if-no-files-found: error
          retention-days: 30
